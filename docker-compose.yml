services:

  oltp_db:
    image: postgres:16
    container_name: grocery_oltp
    environment:
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_pass
      POSTGRES_DB: grocery_oltp
    ports:
      - "5434:5432"
    volumes:
      - ./init/oltp_schema.sql:/docker-entrypoint-initdb.d/oltp_schema.sql
    networks:
      - grocery_net
    restart: unless-stopped

  olap_db:
    image: postgres:16
    container_name: grocery_olap
    environment:
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_pass
      POSTGRES_DB: grocery_olap
    ports:
      - "5435:5432"
    volumes:
      - olap_data:/var/lib/postgresql/data
      - ./init/olap_schema.sql:/docker-entrypoint-initdb.d/olap_schema.sql
    networks:
      - grocery_net
    restart: unless-stopped

volumes:
  olap_data:

networks:
  grocery_net:
    driver: bridge
